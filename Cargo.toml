[package]
name = "unibz-terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
webkit6 = "0.6"
futures-channel = "0.3"
ureq = { version = "2.12", features = ["json"] }
url = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"
